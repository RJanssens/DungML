[project]
name = "dungml-workspace"
version = "0.1.0"
description = "DSL, backend, and editor for tabletop RPG map layout"
requires-python = ">=3.12"
dependencies = [
    "dungml",
    "dungml-backend",
    "dungml-mcp",
]

[tool.uv.workspace]
members = ["packages/dsl", "packages/backend", "packages/mcp"]

[tool.uv.sources]
dungml = { workspace = true }
dungml-backend = { workspace = true }
dungml-mcp = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
