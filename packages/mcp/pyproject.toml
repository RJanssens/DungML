[project]
name = "dungml-mcp"
version = "0.1.0"
description = "MCP server for dungml — list/create projects, CRUD maps, render"
requires-python = ">=3.12"
dependencies = [
    "dungml",
    "dungml-backend",
    "mcp>=1.2",
]

[project.scripts]
dmap-mcp = "dungml_mcp.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dungml_mcp"]

[tool.uv.sources]
dungml = { workspace = true }
dungml-backend = { workspace = true }
