[project]
name = "dungml"
version = "0.1.0"
description = "DSL parser, semantic model, and renderer ABC for dungml maps"
requires-python = ">=3.12"
dependencies = [
    "lark>=1.2.2",
    "pydantic>=2.7",
]

[project.scripts]
dmap = "dungml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dungml"]

[tool.hatch.build.targets.wheel.force-include]
"src/dungml/grammar.lark" = "dungml/grammar.lark"
"src/dungml/includes" = "dungml/includes"
