[project]
name = "dungml-backend"
version = "0.1.0"
description = "FastAPI service for dungml: projects, maps, auth, render API"
requires-python = ">=3.12"
dependencies = [
    "dungml",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.7",
]

[project.scripts]
dmap-server = "dungml_backend.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dungml_backend"]

[tool.uv.sources]
dungml = { workspace = true }
